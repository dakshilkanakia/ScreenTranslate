name: ScreenTranslate
options:
  bundleIdPrefix: com.dakshil
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenTranslateiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/ScreenTranslateiOS
        excludes:
          - Info.plist
      - path: Sources/ScreenTranslate/OCRService.swift
      - path: Sources/ScreenTranslate/Log.swift
    info:
      path: Sources/ScreenTranslateiOS/Info.plist
      properties:
        NSSiriUsageDescription: "Used to trigger screen translation by voice."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakshil.ScreenTranslateiOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  ScreenTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources/ScreenTranslate
        excludes:
          - Info.plist
    info:
      path: Sources/ScreenTranslate/Info.plist
      properties:
        LSUIElement: true
        NSSiriUsageDescription: "Used to trigger screen translation by voice."
        NSScreenCaptureUsageDescription: "Needed to capture the screen for translation."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    entitlements:
      path: ScreenTranslate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.screen-capture: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakshil.ScreenTranslate
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
