name: ScreenTranslate
options:
  bundleIdPrefix: com.dakshil
  deploymentTarget:
    macOS: "15.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources/ScreenTranslate
        excludes:
          - Info.plist
    info:
      path: Sources/ScreenTranslate/Info.plist
      properties:
        LSUIElement: true
        NSSiriUsageDescription: "Used to trigger screen translation by voice."
        NSScreenCaptureUsageDescription: "Needed to capture the screen for translation."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    entitlements:
      path: ScreenTranslate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.screen-capture: true
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakshil.ScreenTranslate
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
